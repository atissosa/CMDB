# SQL Server disposable container (not src/test/resources or a default database).
cmdb.bd.encrypt=false
cmdb.bd.pool.min-idle=1
cmdb.bd.pool.max-size=3
cmdb.bd.pool.connection-timeout-ms=3000
cmdb.bd.pool.idle-timeout-ms=10000
cmdb.bd.pool.max-lifetime-ms=120000
cmdb.bd.pool.validation-timeout-ms=1500
cmdb.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,null

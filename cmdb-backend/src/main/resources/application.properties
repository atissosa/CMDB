spring.application.name=cmdb-backend
# No default environment and no default host, database or credentials.
cmdb.bd.proveedor=MSSQLSERVER
cmdb.bd.puerto=1433
cmdb.bd.encrypt=true
cmdb.bd.trust-server-certificate=false
cmdb.bd.pool.min-idle=1
cmdb.bd.pool.max-size=8
cmdb.bd.pool.connection-timeout-ms=5000
cmdb.bd.pool.idle-timeout-ms=30000
cmdb.bd.pool.max-lifetime-ms=600000
cmdb.bd.pool.validation-timeout-ms=3000
cmdb.login.tipo=CLASICO
cmdb.departamento.defecto=Mesa de Ayuda
cmdb.bd.usuario=${CMDB_DB_USERNAME:}
cmdb.bd.contrasenia=${CMDB_DB_PASSWORD:}
cmdb.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
cmdb.cors.allowed-headers=origin,content-type,accept,authorization
cmdb.cors.allow-credentials=false
cmdb.cors.max-age-seconds=600

spring.datasource.url=jdbc:sqlserver://${cmdb.bd.servidor}:${cmdb.bd.puerto};databaseName=${cmdb.bd.nombre};encrypt=${cmdb.bd.encrypt};trustServerCertificate=${cmdb.bd.trust-server-certificate}
spring.datasource.username=${cmdb.bd.usuario}
spring.datasource.password=${cmdb.bd.contrasenia}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.pool-name=cmdbPool
spring.datasource.hikari.minimum-idle=${cmdb.bd.pool.min-idle}
spring.datasource.hikari.maximum-pool-size=${cmdb.bd.pool.max-size}
spring.datasource.hikari.connection-timeout=${cmdb.bd.pool.connection-timeout-ms}
spring.datasource.hikari.idle-timeout=${cmdb.bd.pool.idle-timeout-ms}
spring.datasource.hikari.max-lifetime=${cmdb.bd.pool.max-lifetime-ms}
spring.datasource.hikari.validation-timeout=${cmdb.bd.pool.validation-timeout-ms}

# Preserve the full API base used by the unmodified legacy frontend.
server.servlet.context-path=/cmdb-backend

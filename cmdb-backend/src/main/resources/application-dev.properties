# Local development SQL Server may not have a trusted TLS certificate.
# Explicit external host/database/credentials are still required.
cmdb.bd.encrypt=false
cmdb.bd.pool.min-idle=1
cmdb.bd.pool.max-size=6
cmdb.bd.pool.connection-timeout-ms=5000
cmdb.bd.pool.idle-timeout-ms=30000
cmdb.bd.pool.max-lifetime-ms=600000
cmdb.bd.pool.validation-timeout-ms=3000
cmdb.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:18080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,null

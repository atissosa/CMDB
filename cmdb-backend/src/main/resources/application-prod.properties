# Production requires encrypted JDBC and certificate verification by default.
cmdb.bd.encrypt=true
cmdb.bd.pool.min-idle=2
cmdb.bd.pool.max-size=10
cmdb.bd.pool.connection-timeout-ms=5000
cmdb.bd.pool.idle-timeout-ms=30000
cmdb.bd.pool.max-lifetime-ms=600000
cmdb.bd.pool.validation-timeout-ms=3000
cmdb.cors.allowed-origins=${CMDB_CORS_ALLOWED_ORIGINS:}

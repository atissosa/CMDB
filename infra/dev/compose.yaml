name: cmdb-dev
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    user: "0:0"
    environment:
      ACCEPT_EULA: "${CMDB_DEV_ACCEPT_EULA:?Accept the Microsoft SQL Server EULA with CMDB_DEV_ACCEPT_EULA=Y}"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
    # Read the private bind-mounted secret as root, then run the engine as mssql.
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - 'export MSSQL_SA_PASSWORD="$$(cat /run/secrets/sa_password)"; exec setpriv --reuid=10001 --regid=10001 --clear-groups /opt/mssql/bin/sqlservr'
    ports:
      - "127.0.0.1:${CMDB_DEV_SQL_PORT:-14330}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    secrets:
      - sa_password
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$(cat /run/secrets/sa_password)\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    restart: unless-stopped
volumes:
  sql-data:
    name: cmdb-dev-sql-data
    labels:
      cmdb.purpose: persistent-development
secrets:
  sa_password:
    file: "${CMDB_DEV_CONFIG_DIR:?Run scripts/dev/cmdb-dev.py configure}/sa-password"
